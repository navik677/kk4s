name: desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build PC viewer (Linux, ASan + UBSan)
        shell: bash
        run: |
          set -o pipefail
          DEPS=1 ASAN=1 bash tools/build-desktop.sh 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: bash tools/ci-report.sh build.log
      - name: Smoke test (hello game, headless)
        if: success()
        shell: bash
        run: |
          # xvfb for the window; mingw builds the synthetic .tpm / x86 test DLLs (tests/tpm)
          sudo apt-get install -y --no-install-recommends xvfb gcc-mingw-w64-i686
          export SDL_AUDIODRIVER=dummy KK4S_ROOT="$PWD/run-data"
          export ASAN_OPTIONS=detect_leaks=0
          timeout 15s xvfb-run -a ./out-desktop/kk4s tests/tjs/hello > smoke.log 2>&1 || code=$?
          cat run-data/logs/*.log >> smoke.log 2>/dev/null || true
          cat smoke.log
          # 124 = still running after 15s (good: main loop alive)
          if [ "${code:-0}" != "124" ] && [ "${code:-0}" != "0" ]; then
            echo "::error title=smoke test::$(tail -40 smoke.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            exit 1
          fi
      - name: Tests - decoders (PBD, PSB, CXDEC)
        if: success()
        shell: bash
        run: |
          set -o pipefail
          KK4S_TEST_WORK="$PWD/build-tests" bash tools/run-tests.sh --group decoders \
            out-desktop/kk4s 2>&1 | tee tests-decoders.log
      - name: Tests - xp3 storage layer (project dir, overlay precedence)
        if: success()
        shell: bash
        run: |
          set -o pipefail
          KK4S_TEST_WORK="$PWD/build-tests" bash tools/run-tests.sh --group xp3 \
            out-desktop/kk4s 2>&1 | tee tests-xp3.log
      - name: Tests - engine I/O (TextStream, AlphaMovie, DataPack)
        if: success()
        shell: bash
        run: |
          set -o pipefail
          KK4S_TEST_WORK="$PWD/build-tests" bash tools/run-tests.sh --group io \
            out-desktop/kk4s 2>&1 | tee tests-io.log
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kk4s-linux-${{ github.sha }}
          path: |
            out-desktop/kk4s
            build.log
            smoke.log
            tests-*.log
            build-tests/*.log
          if-no-files-found: warn

  # MinGW build. This is a compile check plus a portable decoder/unit-test run;
  # the viewer is not executed here, so do not read a green run as "Windows
  # runtime verified". The job is blocking: a compile break on MinGW is a real
  # regression, not an experiment.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git
      - name: Build PC viewer (Windows)
        run: |
          set -o pipefail
          DEPS=1 bash tools/build-desktop.sh 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: bash tools/ci-report.sh build.log
      - name: Tests - decoders (PBD, PSB, CXDEC)
        if: success()
        run: |
          set -o pipefail
          KK4S_TEST_WORK="$PWD/build-tests" bash tools/run-tests.sh --group decoders \
            out-desktop/kk4s.exe 2>&1 | tee tests-decoders.log
      - name: Bundle DLLs
        if: success()
        run: |
          mkdir -p dist && cp out-desktop/kk4s.exe dist/
          ldd dist/kk4s.exe | grep -i ucrt64 | awk '{print $3}' | xargs -r -I{} cp {} dist/
          mkdir -p dist/games && echo "Put game folders here" > dist/games/README.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kk4s-windows-${{ github.sha }}
          path: |
            dist/
            build.log
            tests-decoders.log
            build-tests/*.log
          if-no-files-found: warn
